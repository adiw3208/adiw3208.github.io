<!doctype html>
<html lang="id">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0" />
        <title>STUNT | Digital Edition</title>

        <script src="https://cdn.tailwindcss.com"></script>
        <link
            href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap"
            rel="stylesheet" />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

        <script>
            tailwind.config = {
                theme: {
                    extend: {
                        fontFamily: {
                            poppins: ["Poppins", "sans-serif"],
                        },
                        colors: { cyber: "#00f2ff" },
                    },
                },
            };
        </script>

        <style>
            * {
                cursor: none;
            }
            body {
                background: #05060c;
                overflow: hidden;
            }

            canvas {
                position: fixed;
                inset: 0;
                z-index: 1;
                pointer-events: none;
            }

            #app {
                position: relative;
                z-index: 10;
            }

            /* ===== GLASS CARD ===== */
            .glass {
                background: rgba(255, 255, 255, 0.07);
                backdrop-filter: blur(14px);
                border: 1px solid rgba(255, 255, 255, 0.14);
            }
            .link {
                transition: 0.35s;
            }
            .link:hover {
                transform: translateY(-2px) scale(1.03);
                box-shadow: 0 0 30px currentColor;
            }

            /* ===== MAGNIFIER CURSOR ===== */
            #magnifier {
                position: fixed;
                width: 44px;
                height: 44px;
                border-radius: 50%;
                pointer-events: none;
                z-index: 9999;

                /* INI KUNCINYA */
                backdrop-filter: contrast(1.4) saturate(1.6);
                background: rgba(0, 242, 255, 0.06);

                border: 1px solid rgba(0, 242, 255, 0.45);
                box-shadow:
                    0 0 25px rgba(0, 242, 255, 0.35),
                    inset 0 0 18px rgba(0, 242, 255, 0.25);

                transform: translate(-50%, -50%) scale(1);
                transition:
                    width 0.25s ease,
                    height 0.25s ease,
                    transform 0.25s ease,
                    box-shadow 0.25s ease,
                    backdrop-filter 0.25s ease;
            }

            /* MODE MAGNIFIER (HOVER) */
            .magnify {
                width: 80px !important;
                height: 80px !important;

                /* PERBESARAN PALSU TAPI TERASA */
                transform: translate(-50%, -50%) scale(1.08);

                backdrop-filter: contrast(1.9) saturate(2);

                box-shadow:
                    0 0 55px rgba(0, 242, 255, 0.85),
                    inset 0 0 30px rgba(0, 242, 255, 0.45);
            }

            @media (max-width: 640px) {
                * {
                    cursor: auto;
                }
                #magnifier {
                    display: none;
                }
            }
            #loader {
                position: fixed;
                inset: 0;
                background: #050608;
                display: flex;
                align-items: center;
                justify-content: center;
                z-index: 10000;
                transition:
                    opacity 0.6s ease,
                    visibility 0.6s ease;
            }

            #loader.hide {
                opacity: 0;
                visibility: hidden;
            }

            .loader-box {
                text-align: center;
                animation: bootIn 0.8s ease forwards;
            }

            .loader-title {
                font-size: 22px;
                letter-spacing: 0.45em;
                font-weight: 800;
                color: #fff;
                text-shadow: 0 0 25px rgba(0, 242, 255, 0.8);
            }

            .loader-title span {
                color: #00f2ff;
            }

            .loader-sub {
                margin-top: 10px;
                font-size: 10px;
                letter-spacing: 0.35em;
                opacity: 0.6;
            }

            .loader-bar {
                width: 220px;
                height: 3px;
                background: rgba(255, 255, 255, 0.08);
                margin: 18px auto 0;
                overflow: hidden;
                position: relative;
            }

            .loader-bar span {
                position: absolute;
                inset: 0;
                background: linear-gradient(
                    90deg,
                    transparent,
                    #00f2ff,
                    transparent
                );
                animation: loadingMove 1.3s infinite;
            }

            @keyframes loadingMove {
                from {
                    transform: translateX(-100%);
                }
                to {
                    transform: translateX(100%);
                }
            }

            @keyframes bootIn {
                from {
                    opacity: 0;
                    transform: scale(0.9);
                }
                to {
                    opacity: 1;
                    transform: scale(1);
                }
            }
        </style>
    </head>

    <body class="font-poppins text-white">
        <canvas id="bg"></canvas>
        <div id="magnifier"></div>
        <!-- LOADING SCREEN -->
        <div id="loader">
            <div class="loader-box">
                <div class="loader-title">STUNT<span>::</span>BOOTING</div>
                <div class="loader-bar">
                    <span></span>
                </div>
                <div class="loader-sub">initializing STUNT system</div>
            </div>
        </div>

        <main
            id="app"
            class="h-screen grid grid-rows-[auto_1fr_auto] items-center px-4 sm:px-6">
            <header class="text-center pt-8 sm:pt-10">
                <div
                    class="w-20 h-20 sm:w-24 sm:h-24 md:w-28 md:h-28 mx-auto mb-5 rounded-full border-2 border-cyber shadow-[0_0_28px_#00f2ff] overflow-hidden">
                    <img
                        src="https://api.dicebear.com/7.x/pixel-art/svg?seed=Stunt"
                        class="w-full h-full" />
                </div>
                <h1
                    class="text-3xl sm:text-4xl md:text-5xl font-black italic tracking-[0.3em] drop-shadow-[0_0_28px_#00f2ff]">
                    STUNT
                </h1>
            </header>

            <nav
                id="links"
                class="w-full max-w-[420px] mx-auto space-y-3"></nav>

            <footer
                class="text-center pb-6 sm:pb-8 text-[8px] sm:text-[9px] tracking-[1em] opacity-25">
                STUNT | FRONTEND DEVELOPER
            </footer>
        </main>

        <script>
            window.addEventListener("load", () => {
                setTimeout(() => {
                    document.getElementById("loader").classList.add("hide");
                }, 3000);
            });

            /* ================= DATA ================= */
            const SOCIAL_LINKS = [
                {
                    name: "Discord",
                    url: "https://discord.com/invite/N9Zugqbzep",
                    icon: "fa-discord",
                    brand: "brands",
                    color: "#5865F2",
                },
                {
                    name: "Facebook",
                    url: "https://www.facebook.com/stunt3208",
                    icon: "fa-facebook-f",
                    brand: "brands",
                    color: "#1877F2",
                },
                {
                    name: "GitHub",
                    url: "https://github.com/adiw3208",
                    icon: "fa-github",
                    brand: "brands",
                    color: "#ffffff",
                },
                {
                    name: "Instagram",
                    url: "https://www.instagram.com/adiwhydi___",
                    icon: "fa-instagram",
                    brand: "brands",
                    color: "#E1306C",
                },
                {
                    name: "LinkedIn",
                    url: "https://www.linkedin.com/in/adiwhydi/",
                    icon: "fa-linkedin-in",
                    brand: "brands",
                    color: "#0A66C2",
                },
                {
                    name: "Saweria",
                    url: "https://saweria.co/DarkStunt",
                    icon: "fa-heart",
                    brand: "solid",
                    color: "#ff4d6d",
                },
                {
                    name: "Spotify",
                    url: "https://open.spotify.com/user/316wj7obac62x6d5ewk2v455zlry",
                    icon: "fa-spotify",
                    brand: "brands",
                    color: "#1DB954",
                },
                {
                    name: "TikTok",
                    url: "https://www.tiktok.com/@adiwhydi___",
                    icon: "fa-tiktok",
                    brand: "brands",
                    color: "#00f2ff",
                },
                {
                    name: "YouTube",
                    url: "https://www.youtube.com/@stunt-clips",
                    icon: "fa-youtube",
                    brand: "brands",
                    color: "#FF0000",
                },
            ];

            /* ===== RENDER LINKS ===== */
            const wrap = document.getElementById("links");
            SOCIAL_LINKS.forEach((l) => {
                const a = document.createElement("a");
                a.href = l.url;
                a.target = "_blank";
                a.className =
                    "glass link flex items-center justify-between px-8 py-4 rounded-2xl";
                a.style.color = l.color;
                a.innerHTML = `
                    <div class="flex items-center gap-4">
                    <i class="fa-${l.brand} ${l.icon}"></i>
                    <span class="text-[11px] tracking-[0.35em] font-bold">${l.name}</span>
                    </div>
                    <i class="fa-solid fa-chevron-right text-[10px] opacity-40"></i>
                `;
                a.addEventListener("mouseenter", () =>
                    magnifier.classList.add("magnify"),
                );
                a.addEventListener("mouseleave", () =>
                    magnifier.classList.remove("magnify"),
                );
                wrap.appendChild(a);
            });

            /* ===== MAGNIFIER CURSOR LOGIC ===== */
            const magnifier = document.getElementById("magnifier");
            let mx = 0,
                my = 0,
                cx = 0,
                cy = 0;

            addEventListener("mousemove", (e) => {
                mx = e.clientX;
                my = e.clientY;
            });
            (function follow() {
                cx += (mx - cx) * 0.18;
                cy += (my - cy) * 0.18;
                magnifier.style.left = cx + "px";
                magnifier.style.top = cy + "px";
                requestAnimationFrame(follow);
            })();

            /* ===== CODE RAIN ===== */
            const canvas = document.getElementById("bg");
            const ctx = canvas.getContext("2d");
            let w,
                h,
                cols,
                drops = [],
                speeds = [];
            const chars = "{}[]<>/*+=-;:.01$#@";

            function resize() {
                w = canvas.width = innerWidth;
                h = canvas.height = innerHeight;
                cols = Math.floor(w / 26);
                drops = [];
                speeds = [];
                for (let i = 0; i < cols; i++) {
                    drops[i] = (Math.random() * h) / 26;
                    speeds[i] = 0.045 + Math.random() * 0.08;
                }
            }
            resize();
            addEventListener("resize", resize);

            function drawRain() {
                ctx.fillStyle = "rgba(5,6,12,0.12)";
                ctx.fillRect(0, 0, w, h);
                ctx.fillStyle = "rgba(0,242,255,.42)";
                ctx.font = "13px monospace";

                for (let i = 0; i < drops.length; i++) {
                    if (Math.random() > 0.996)
                        drops[i + "_c"] =
                            chars[Math.floor(Math.random() * chars.length)];
                    const c = drops[i + "_c"] || chars[0];
                    ctx.fillText(c, i * 26, drops[i] * 26);
                    if (drops[i] * 26 > h && Math.random() > 0.996)
                        drops[i] = -6;
                    drops[i] += speeds[i];
                }
            }

            (function animate() {
                drawRain();
                requestAnimationFrame(animate);
            })();
        </script>
    </body>
</html>
